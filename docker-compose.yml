services:
  erddap:
    container_name: ${CONTAINER_NAME:-erddap}
    # axiom/docker-erddap:v2.31.1 with Java patched for CVE-2026-114938 (Dockerfile). `docker compose build erddap`
    # on each host; back to the axiom image once it ships Temurin >= 25.0.5.1.
    image: cioos-pacific-erddap/erddap:v2.31.1-temurin25.0.5.1
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Tomcat's logs readable (0644 instead of 0640) by erddap-logs, which runs as another user
      UMASK: "0022"
    ports:
      - "${HOST_PORT:-8090}:8080"
    volumes:
      - "./erddap/conf/robots.txt:/usr/local/tomcat/webapps/ROOT/robots.txt"
      - "./erddap/content:/usr/local/tomcat/content/erddap"
      - "./erddap/data:/erddapData"
      - "${DATASETS_DIR:-./datasets}:/datasets"
      # Tomcat's own temp dir: the image chowns it on every start, so it must never be the host's /tmp
      - "./tomcat-temp:/usr/local/tomcat/temp/"
      - "./datasets.d:/datasets.d:ro"
      # only our script: since v2.27 the image builds datasets.xml from /datasets.d in its own
      # /init.d/50-datasets.d.sh, which mounting the whole directory would hide. 90- runs after it.
      - "./init.d/replace-datasets-secrets.sh:/init.d/90-replace-datasets-secrets.sh:ro"
      - ./tomcatLogs:/usr/local/tomcat/logs
      # access-log format for cioos-pacific-obs analytics (comment in the file). Not :ro: the image chowns it.
      - ./erddap/conf/server.xml:/usr/local/tomcat/conf/server.xml
    logging: &obs-logging
      # Compose project/service in each log line, so the cioos-pacific-obs agent can name it (that README,
      # daemon.json). Set here as well so it holds on hosts whose daemon.json doesn't have it yet.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels-regex: "^com\\.docker\\.compose\\.(project|service)$"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/erddap/index.html"
        ]
      interval: 10s
  pipelines-db:
    # Optional (COMPOSE_PROFILES=pipelines-db): the cioos-pipelines database (cioos-siooc/cioos-pacific-pipeline)
    # reached through its Cloudflare Tunnel with an Access service token. ERDDAP then connects to
    #   jdbc:postgresql://pipelines-db:5432/cioos
    # See README "Database from cioos-pipelines". Nothing changes on servers without the profile.
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    profiles: ["pipelines-db"]
    restart: unless-stopped
    command: access tcp
    environment:
      TUNNEL_SERVICE_HOSTNAME: ${PIPELINES_DB_HOSTNAME:-}
      TUNNEL_SERVICE_URL: 0.0.0.0:5432
      TUNNEL_SERVICE_TOKEN_ID: ${PIPELINES_DB_ACCESS_CLIENT_ID:-}
      TUNNEL_SERVICE_TOKEN_SECRET: ${PIPELINES_DB_ACCESS_CLIENT_SECRET:-}
  erddap-logs:
    # Tomcat's access log and logs, and ERDDAP's log.txt → stdout, where the cioos-pacific-obs agent collects them
    image: gynter/rsyslog-relp:alpine
    restart: unless-stopped
    logging: *obs-logging
    volumes:
      - ./erddap/data:/erddapData:ro
      - ./tomcatLogs:/usr/local/tomcat/logs:ro
      - ./rsyslog/rsyslog.conf:/etc/rsyslog.conf:ro
      - ./rsyslog/rsyslog.d:/etc/rsyslog.d:ro
    depends_on:
      - erddap

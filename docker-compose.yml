version: '2'
services:
  erddap:
    container_name: ${CONTAINER_NAME:-erddap}
    image: axiom/docker-erddap:2.23-jdk17-openjdk
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8090}:8080"
    volumes:
      - "./erddap/conf/robots.txt:/usr/local/tomcat/webapps/ROOT/robots.txt"
      - "./erddap/content:/usr/local/tomcat/content/erddap"
      - "./erddap/data:/erddapData"
      - "${DATASETS_DIR:-./datasets}:/datasets"
      - "/tmp/:/usr/local/tomcat/temp/"
      - "./datasets.d:/datasets.d:ro"
      - "./init.d:/init.d"
      - ./tomcatLogs:/usr/local/tomcat/logs
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/erddap/index.html"
        ]
      interval: 10s
  pipelines-db:
    # Optional (COMPOSE_PROFILES=pipelines-db): the cioos-pipelines database (cioos-siooc/cioos-pacific-pipeline)
    # reached through its Cloudflare Tunnel with an Access service token. ERDDAP then connects to
    #   jdbc:postgresql://pipelines-db:5432/cioos
    # See README "Database from cioos-pipelines". Nothing changes on servers without the profile.
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    profiles: ["pipelines-db"]
    restart: unless-stopped
    command: access tcp
    environment:
      TUNNEL_SERVICE_HOSTNAME: ${PIPELINES_DB_HOSTNAME:-}
      TUNNEL_SERVICE_URL: 0.0.0.0:5432
      TUNNEL_SERVICE_TOKEN_ID: ${PIPELINES_DB_ACCESS_CLIENT_ID:-}
      TUNNEL_SERVICE_TOKEN_SECRET: ${PIPELINES_DB_ACCESS_CLIENT_SECRET:-}
  erddap-logs:
    image: gynter/rsyslog-relp:alpine
    volumes:
      - ./erddap/data:/erddapData:ro
      - ./tomcatLogs:/usr/local/tomcat/logs:ro
      - ./rsyslog/rsyslog.conf:/etc/rsyslog.conf:ro
      - ./rsyslog/rsyslog.d:/etc/rsyslog.d:ro
    depends_on:
      - erddap

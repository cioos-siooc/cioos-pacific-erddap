# The pipeline server's database (vm23) as pipelines-db:5432 for DB-backed datasets (DFO_MEDS_BUOYS,
# ECCC_MSC_BUOYS), through its Cloudflare TCP tunnel hostname, the same way data.cioospacific.ca reaches it.
# ERDDAP_SECRET_hakai_database_connection in .env holds the JDBC URL.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.pipelines-db.yml up -d
services:
  pipelines-db:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: access tcp --hostname ${PIPELINES_DB_HOSTNAME} --url 0.0.0.0:5432

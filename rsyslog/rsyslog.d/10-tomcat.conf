input(
    type="imfile"
    File="/usr/local/tomcat/logs/*.log"
    Tag="tomcat"
    Ruleset="tomcatToStdOut"
    readMode="0"
    escapeLF="on"
    freshStartTail="on"
)

input(
    type="imfile"
    File="/usr/local/tomcat/logs/localhost_access_log*"
    Tag="access"
    Ruleset="tomcatToStdOut"
    # a new relay container starts at the end of each file: replaying old files would count their requests again
    freshStartTail="on"
)

template(name="tomcatStdOut" type="list") {
    constant(value="[")
    property(name="syslogtag" caseconversion="upper")
    constant(value="] ")
    property(name="msg" droplastlf="on" )
    constant(value="\n")
}

ruleset(name="tomcatToStdOut") {
    action(
        type="omstdout" template="tomcatStdOut"
    )
}
# systemd drop-in for the cloudflared service that publishes this ERDDAP through a Cloudflare Tunnel.
# Install as /etc/systemd/system/cloudflared.service.d/override.conf (README: "Remote host: rebuild from the bucket").
#
# Networks that block UDP (ONC's does) make cloudflared's first protocol, QUIC, time out; systemd then kills the
# service before it falls back to HTTP/2. Start on HTTP/2 and give the first connection time.
[Service]
Environment=TUNNEL_TRANSPORT_PROTOCOL=http2
TimeoutStartSec=60
